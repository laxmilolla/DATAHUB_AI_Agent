<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Execution Results - Test Automation Generator</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <header>
            <h1>Test Automation Generator</h1>
            <p class="subtitle">
                <a href="/">← Back to Home</a> | 
                <span style="opacity: 0.8;">Powered by NCI & ESI</span>
            </p>
        </header>

        <main>
            <div id="results-content">
            <div class="card">
                    <div class="loading-skeleton">
                        <div class="skeleton-header"></div>
                        <div class="skeleton-line"></div>
                        <div class="skeleton-line" style="width: 80%;"></div>
                        <div class="skeleton-line" style="width: 60%;"></div>
                    </div>
                    <p class="loading" style="text-align: center; padding: 20px;">
                        <span class="spinner"></span> Loading execution results...
                    </p>
                </div>
            </div>
        </main>

        <footer>
            <p>National Cancer Institute & Essential Software Inc.</p>
            <p style="font-size: 0.85em; margin-top: 5px; opacity: 0.7;">
                AI-Driven Test Generation | LLM-Powered Element Discovery
            </p>
        </footer>
    </div>

    <script>
        const executionId = "{{ execution_id }}";
        let pollInterval;
        let currentResults = null;
        
        // ===================================
        // SAFE DATA ACCESS HELPERS
        // ===================================
        
        function safeGet(obj, path, defaultValue = null) {
            try {
                const value = path.split('.').reduce((o, p) => o?.[p], obj);
                return value !== undefined && value !== null ? value : defaultValue;
            } catch {
                return defaultValue;
            }
        }
        
        function safeArray(arr) {
            return Array.isArray(arr) ? arr : [];
        }
        
        function safeNumber(val, defaultValue = 0) {
            const num = Number(val);
            return isNaN(num) ? defaultValue : num;
        }
        
        function safeString(val, defaultValue = '') {
            return val != null ? String(val) : defaultValue;
        }
        
        // ===================================
        // DATA FETCHING
        // ===================================
        
        async function pollResults() {
            try {
                let response = await fetch(`/api/executions/${executionId}/results`);
                let results;
                
                if (response.ok) {
                    results = await response.json();
                } else {
                    response = await fetch(`/api/executions/${executionId}/status`);
                    if (response.ok) {
                    const status = await response.json();
                    results = {
                        execution_id: executionId,
                            status: safeGet(status, 'status', 'unknown'),
                            story: safeGet(status, 'story', 'No story available'),
                            actions_taken: safeArray(status.actions_taken),
                            screenshots: safeArray(status.screenshots),
                            discoveries: safeArray(status.discoveries),
                            error: safeGet(status, 'error')
                        };
                    } else {
                        throw new Error('Failed to fetch execution data');
                    }
                }
                
                currentResults = results;
                displayResults(results);
                
                if (results.status === 'running') {
                    document.getElementById('live-indicator')?.style.setProperty('display', 'inline-block');
                } else {
                    document.getElementById('live-indicator')?.style.setProperty('display', 'none');
                    clearInterval(pollInterval);
                }
            } catch (error) {
                console.error('Error loading results:', error);
                displayError(error.message);
            }
        }
        
        // ===================================
        // ERROR STATE DISPLAY
        // ===================================
        
        function displayError(message) {
            const container = document.getElementById('results-content');
            container.innerHTML = `
                <div class="status-banner status-error">
                    <div class="status-icon">❌</div>
                    <div class="status-content">
                        <h2>Unable to Load Execution Results</h2>
                        <p>${safeString(message, 'An unknown error occurred')}</p>
                        <div class="status-actions">
                            <button class="btn-primary" onclick="location.reload()">
                                🔄 Retry
                            </button>
                            <button class="btn-secondary" onclick="location.href='/'">
                                ← Back to Home
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }
        
        // ===================================
        // MAIN DISPLAY FUNCTION
        // ===================================
        
        function displayResults(results) {
            const container = document.getElementById('results-content');
            
            // Calculate metrics with safe defaults
            const actions = safeArray(results.actions_taken);
            const screenshots = safeArray(results.screenshots);
            const discoveries = safeArray(results.discoveries);
            
            const totalSteps = actions.length;
            const passedSteps = actions.filter(a => safeString(a.result).includes('✅')).length;
            const failedSteps = actions.filter(a => safeString(a.result).includes('❌')).length;
            const successRate = totalSteps > 0 ? Math.round((passedSteps / totalSteps) * 100) : 0;
            const duration = safeNumber(results.duration, 0).toFixed(1);
            const status = safeString(results.status, 'unknown');
            const story = safeString(results.story, 'No test scenario provided');
            const error = safeGet(results, 'error');
            
            // Determine overall status
            let overallStatus = 'success';
            let statusIcon = '✅';
            let statusTitle = 'Test Completed Successfully';
            let statusClass = 'status-success';
            
            if (status === 'running') {
                overallStatus = 'running';
                statusIcon = '⏳';
                statusTitle = 'Test Execution In Progress';
                statusClass = 'status-running';
            } else if (status === 'error' || status === 'timeout') {
                overallStatus = 'error';
                statusIcon = '❌';
                statusTitle = 'Test Execution Failed';
                statusClass = 'status-error';
            } else if (failedSteps > 0) {
                overallStatus = 'partial';
                statusIcon = '⚠️';
                statusTitle = 'Test Partially Completed';
                statusClass = 'status-warning';
            } else if (totalSteps === 0) {
                overallStatus = 'empty';
                statusIcon = '⚪';
                statusTitle = 'No Test Data Available';
                statusClass = 'status-empty';
            }
            
            let html = `
                <!-- Status Banner -->
                <div class="status-banner ${statusClass}">
                    <div class="status-icon">${statusIcon}</div>
                    <div class="status-content">
                        <h2>
                            ${statusTitle}
                            <span id="live-indicator" class="live-indicator" style="display: none;"></span>
                        </h2>
                        <div class="status-meta">
                            <span class="meta-item"><strong>ID:</strong> ${executionId}</span>
                            <span class="meta-separator">•</span>
                            <span class="meta-item">${new Date().toLocaleString()}</span>
                        </div>
                        
                        <!-- Progress Bar -->
                        <div class="progress-bar-container">
                            <div class="progress-bar">
                                <div class="progress-fill" style="width: ${successRate}%"></div>
                            </div>
                            <div class="progress-label">${passedSteps}/${totalSteps} Steps (${successRate}%)</div>
                        </div>
                        
                        <!-- Quick Stats -->
                        <div class="quick-stats">
                            <div class="stat-item">
                                <div class="stat-value">${totalSteps}</div>
                                <div class="stat-label">Total Steps</div>
                            </div>
                            <div class="stat-item stat-success">
                                <div class="stat-value">${passedSteps}</div>
                                <div class="stat-label">Passed</div>
                            </div>
                            ${failedSteps > 0 ? `
                            <div class="stat-item stat-error">
                                <div class="stat-value">${failedSteps}</div>
                                <div class="stat-label">Failed</div>
                            </div>
                            ` : ''}
                            <div class="stat-item">
                                <div class="stat-value">${duration}s</div>
                                <div class="stat-label">Duration</div>
                            </div>
                            <div class="stat-item">
                                <div class="stat-value">${screenshots.length}</div>
                                <div class="stat-label">Screenshots</div>
                            </div>
                            <div class="stat-item">
                                <div class="stat-value">${discoveries.length}</div>
                                <div class="stat-label">Discoveries</div>
                            </div>
                        </div>
                        
                        <!-- Action Buttons -->
                        ${status === 'completed' ? `
                        <div class="status-actions">
                            ${discoveries.length > 0 ? `
                            <button class="btn-primary" onclick="approveDiscoveries()">
                                ✅ Approve & Update Registry
                            </button>
                            ` : ''}
                            <button class="btn-primary" onclick="generatePlaywrightTest()">
                                🎭 Generate Playwright Test
                            </button>
                            <button class="btn-secondary" onclick="viewRegistry()">
                                📋 View Registry
                            </button>
                            <button class="btn-secondary" onclick="downloadRawData()">
                                📥 Download Raw Data
                            </button>
                        </div>
                        ` : status === 'error' || overallStatus === 'partial' ? `
                        <div class="status-actions">
                            <button class="btn-primary" onclick="retryTest()">
                                🔄 Retry Test
                            </button>
                            <button class="btn-secondary" onclick="viewRawData()">
                                📄 View Raw Data
                            </button>
                            <button class="btn-secondary" onclick="location.href='/'">
                                ← Edit Story
                            </button>
                        </div>
                        ` : ''}
                        
                        <div id="action-messages" style="margin-top: 15px;"></div>
                    </div>
                </div>
                
                <!-- Test Story Card -->
                ${story ? `
                <div class="card story-card">
                    <h3 style="color: var(--nci-blue); margin-bottom: 15px;">📝 Test Scenario</h3>
                    <div class="story-content">${story.replace(/\n/g, '<br>')}</div>
                </div>
                ` : ''}
                
                <!-- Main Content Card with Tabs -->
                <div class="card">
                    <div class="tab-navigation">
                        <button class="tab-button active" onclick="switchTab('overview', event)">
                            📊 Overview
                        </button>
                        <button class="tab-button" onclick="switchTab('steps', event)">
                            🎬 Steps (${totalSteps})
                        </button>
                        <button class="tab-button" onclick="switchTab('discoveries', event)">
                            🔍 Discoveries (${discoveries.length})
                        </button>
                        <button class="tab-button" onclick="switchTab('screenshots', event)">
                            📸 Screenshots (${screenshots.length})
                        </button>
                        <button class="tab-button" onclick="switchTab('playwright', event)">
                            🎭 Playwright
                        </button>
                    </div>
                    
                    <!-- Tab 1: Overview -->
                    <div id="tab-overview" class="tab-content active">
                        ${renderOverviewTab(results, totalSteps, passedSteps, failedSteps)}
                    </div>
                    
                    <!-- Tab 2: Steps -->
                    <div id="tab-steps" class="tab-content">
                        ${renderStepsTab(results)}
                    </div>
                    
                    <!-- Tab 3: Discoveries -->
                    <div id="tab-discoveries" class="tab-content">
                        ${renderDiscoveriesTab(results)}
                    </div>
                    
                    <!-- Tab 4: Screenshots -->
                    <div id="tab-screenshots" class="tab-content">
                        ${renderScreenshotsTab(results)}
                    </div>
                    
                    <!-- Tab 5: Playwright -->
                    <div id="tab-playwright" class="tab-content">
                        ${renderPlaywrightTab(results)}
                    </div>
                </div>
            `;
            
            container.innerHTML = html;
        }
        
        // ===================================
        // TAB RENDERERS
        // ===================================
        
        function renderOverviewTab(results, totalSteps, passedSteps, failedSteps) {
            const error = safeGet(results, 'error');
            const summary = safeGet(results, 'summary');
            const actions = safeArray(results.actions_taken);
            
            let html = '<h3 style="color: var(--nci-blue); margin-bottom: 20px;">📊 Execution Summary</h3>';
            
            // Error section
            if (error) {
                html += `
                    <div class="alert alert-error">
                        <div class="alert-icon">❌</div>
                        <div class="alert-content">
                            <h4>Error Details</h4>
                            <pre>${safeString(error)}</pre>
                        </div>
                    </div>
                `;
            }
            
            // Summary section
            if (summary) {
                html += `
                    <div class="alert alert-info">
                        <div class="alert-icon">💡</div>
                        <div class="alert-content">
                            <h4>AI Summary</h4>
                            <p style="white-space: pre-wrap; line-height: 1.8;">${safeString(summary)}</p>
                        </div>
                    </div>
                `;
            }
            
            // Playwright comparison (if exists)
            const playwrightComparison = safeGet(results, 'playwright_comparison');
            if (playwrightComparison && playwrightComparison.status) {
                const pwStatus = safeString(playwrightComparison.status, 'unknown');
                const aiStatus = results.status;
                const match = playwrightComparison.match === true;
                
                html += `
                    <h4 style="margin: 25px 0 15px 0; color: var(--text-primary);">🔄 AI vs Playwright Comparison</h4>
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 25px;">
                        <div style="border: 2px solid var(--esi-teal); border-radius: 8px; padding: 20px; background: var(--bg-secondary);">
                            <h5 style="margin: 0 0 15px; color: var(--esi-teal);">🤖 AI Agent Execution</h5>
                            <div style="font-size: 1.2em; font-weight: 600; margin: 10px 0;">
                                Status: ${aiStatus === 'completed' ? '✅ Completed' : '❌ ' + aiStatus}
                            </div>
                            <div style="margin: 10px 0;">Steps: ${totalSteps} (${passedSteps} passed, ${failedSteps} failed)</div>
                        </div>
                        <div style="border: 2px solid var(--info); border-radius: 8px; padding: 20px; background: var(--bg-secondary);">
                            <h5 style="margin: 0 0 15px; color: var(--info);">🎭 Playwright Test</h5>
                            <div style="font-size: 1.2em; font-weight: 600; margin: 10px 0;">
                                Status: ${pwStatus === 'passed' ? '✅ Passed' : '❌ ' + pwStatus}
                            </div>
                            <div style="margin: 10px 0;">Assertions: ${safeNumber(playwrightComparison.assertions_passed, 0)} passed, ${safeNumber(playwrightComparison.assertions_failed, 0)} failed</div>
                        </div>
                    </div>
                    <div style="background: ${match ? '#E8F5E9' : '#FFF3E0'}; padding: 15px; border-radius: 8px; border-left: 4px solid ${match ? 'var(--success)' : 'var(--warning)'}; margin-bottom: 25px;">
                        <strong>${match ? '✅' : '⚠️'} Match:</strong> ${match ? 'Both tests produced the same result' : 'Results differ - review recommended'}
                    </div>
                `;
            }
            
            // Step timeline
            if (actions.length > 0) {
                html += `
                    <h4 style="margin: 25px 0 15px 0; color: var(--text-primary);">🎬 Step Timeline</h4>
                    <div class="step-timeline">
                `;
                
                actions.forEach((action, index) => {
                    const passed = safeString(action.result).includes('✅');
                    const status = passed ? 'passed' : 'failed';
                    const result = safeString(action.result, 'No result');
                    
                    html += `
                        <div class="step-indicator ${status}" title="${result.substring(0, 100)}">
                            ${index + 1}
                        </div>
                    `;
                    
                    if (index < actions.length - 1) {
                        html += '<div class="step-connector"></div>';
                    }
                });
                
                html += '</div>';
            } else {
                html += renderEmptyState('🎬', 'No Steps Recorded', 'No actions were taken during this execution.');
            }
            
            // Screenshot comparison section
            const aiScreenshots = actions.flatMap(action => safeArray(action.screenshots || []));
            const pwScreenshots = safeArray(results.playwright_screenshots);
            
            console.log('📊 Overview Tab - AI Screenshots:', aiScreenshots.length, aiScreenshots);
            console.log('📊 Overview Tab - PW Screenshots:', pwScreenshots.length, pwScreenshots);
            
            if (aiScreenshots.length > 0 || pwScreenshots.length > 0) {
                html += `
                    <h4 style="margin: 25px 0 15px 0; color: var(--text-primary);">📸 Screenshot Comparison</h4>
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 25px;">
                        <div>
                            <h5 style="color: var(--esi-teal); margin-bottom: 10px;">🤖 AI Screenshots (${aiScreenshots.length})</h5>
                            ${aiScreenshots.length > 0 ? `
                                <div style="display: grid; gap: 10px;">
                                    ${aiScreenshots.slice(0, 3).map(screenshot => `
                                        <div style="border: 2px solid var(--esi-teal); border-radius: 8px; overflow: hidden; cursor: pointer;" onclick="window.open('/api/screenshots/${screenshot}', '_blank')">
                                            <img src="/api/screenshots/${screenshot}" 
                                                 alt="${screenshot}"
                                                 style="width: 100%; height: auto; display: block;"
                                                 onerror="this.style.display='none'">
                                            <div style="padding: 8px; background: var(--bg-tertiary); font-size: 0.75em; text-align: center; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">
                                                ${screenshot}
                                            </div>
                                        </div>
                                    `).join('')}
                                    ${aiScreenshots.length > 3 ? `<div style="text-align: center; color: var(--text-secondary); padding: 10px;">+ ${aiScreenshots.length - 3} more (view in Steps tab)</div>` : ''}
                                </div>
                            ` : '<div style="text-align: center; color: var(--text-secondary); padding: 30px;">No screenshots captured</div>'}
                        </div>
                        <div>
                            <h5 style="color: var(--info); margin-bottom: 10px;">🎭 Playwright Screenshots (${pwScreenshots.length})</h5>
                            ${pwScreenshots.length > 0 ? `
                                <div style="display: grid; gap: 10px;">
                                    ${pwScreenshots.slice(0, 3).map(screenshot => {
                                        const filename = typeof screenshot === 'string' ? screenshot : (screenshot.filename || screenshot.path || '');
                                        return `
                                            <div style="border: 2px solid var(--info); border-radius: 8px; overflow: hidden; cursor: pointer;" onclick="window.open('/api/screenshots/${filename}', '_blank')">
                                                <img src="/api/screenshots/${filename}" 
                                                     alt="${filename}"
                                                     style="width: 100%; height: auto; display: block;"
                                                     onerror="this.style.display='none'">
                                                <div style="padding: 8px; background: var(--bg-tertiary); font-size: 0.75em; text-align: center; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">
                                                    ${filename}
                                                </div>
                                            </div>
                                        `;
                                    }).join('')}
                                    ${pwScreenshots.length > 3 ? `<div style="text-align: center; color: var(--text-secondary); padding: 10px;">+ ${pwScreenshots.length - 3} more (view in Playwright tab)</div>` : ''}
                                </div>
                            ` : '<div style="text-align: center; color: var(--text-secondary); padding: 30px;">No screenshots captured</div>'}
                        </div>
                    </div>
                `;
            }
            
            return html;
        }
        
        function renderStepsTab(results) {
            const actions = safeArray(results.actions_taken);
            
            let html = '<h3 style="color: var(--nci-blue); margin-bottom: 20px;">🎬 Step-by-Step Execution</h3>';
            
            if (actions.length === 0) {
                return html + renderEmptyState('🎬', 'No Steps Available', 'No execution steps were recorded for this test.');
            }
            
            html += '<div class="discovery-grid">';
            
            actions.forEach((action, index) => {
                const tool = safeString(action.tool, 'unknown');
                const input = safeGet(action, 'input', {});
                const result = safeString(action.result, 'No result');
                const iteration = safeNumber(action.iteration, index + 1);
                const passed = result.includes('✅');
                const borderColor = passed ? 'var(--success)' : 'var(--error)';
                const screenshots = safeArray(action.screenshots);
                
                html += `
                    <div class="action-item" style="border-left-color: ${borderColor};">
                        <div class="action-header">
                            <strong class="action-name">${index + 1}. ${tool}</strong>
                            <span class="iteration-badge">Iteration ${iteration}</span>
                            ${passed ? '<span style="color: var(--success); font-size: 1.2em; margin-left: 8px;">✅</span>' : '<span style="color: var(--error); font-size: 1.2em; margin-left: 8px;">❌</span>'}
                        </div>
                        <div style="margin: 10px 0;">
                            <strong style="font-size: 0.85em; color: var(--text-secondary);">Input:</strong>
                            <div class="selector-row" style="margin-top: 4px;">
                                ${JSON.stringify(input)}
                            </div>
                        </div>
                        <div style="margin-top: 10px;">
                            <strong style="font-size: 0.85em; color: var(--text-secondary);">Result:</strong>
                            <div style="color: var(--text-secondary); font-size: 0.9em; margin-top: 4px; line-height: 1.6;">
                                ${result}
                            </div>
                        </div>
                        ${screenshots.length > 0 ? `
                        <div style="margin-top: 15px;">
                            <strong style="font-size: 0.85em; color: var(--text-secondary);">📸 Screenshots (${screenshots.length}):</strong>
                            <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 10px; margin-top: 10px;">
                                ${screenshots.map(screenshot => `
                                    <div style="border: 2px solid ${borderColor}; border-radius: 8px; overflow: hidden; cursor: pointer;" onclick="window.open('/api/screenshots/${screenshot}', '_blank')">
                                        <img src="/api/screenshots/${screenshot}" 
                                             alt="${screenshot}"
                                             style="width: 100%; height: auto; display: block;"
                                             onerror="this.parentElement.innerHTML='<div style=\\'padding: 20px; text-align: center; color: var(--text-secondary);\\'>📷 Not Found</div>'">
                                        <div style="padding: 8px; background: var(--bg-tertiary); font-size: 0.75em; text-align: center; color: var(--text-secondary);">
                                            ${screenshot}
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                        ` : ''}
                    </div>
                `;
            });
            
            html += '</div>';
            return html;
        }
        
        function renderDiscoveriesTab(results) {
            const discoveries = safeArray(results.discoveries);
            
            let html = '<h3 style="color: var(--nci-blue); margin-bottom: 20px;">🔍 AI Element Discovery</h3>';
            
            if (discoveries.length === 0) {
                return html + renderEmptyState('🔍', 'No Discoveries Yet', 
                    'The AI agent will save discovered elements here for future test optimization.');
            }
            
            html += `
                <p style="color: var(--text-secondary); margin-bottom: 20px; line-height: 1.6;">
                    The AI discovered these elements using advanced techniques like <strong>tree climbing</strong> and <strong>LLM disambiguation</strong>. 
                    Approved discoveries are saved to the registry for faster future runs.
                </p>
                <div class="discovery-grid">
            `;
            
            discoveries.forEach(discovery => {
                const name = safeString(discovery.name, 'Unnamed');
                const method = safeString(discovery.discovery_method, 'unknown');
                const isVerification = method === 'table_verification';
                
                if (isVerification) {
                    const metadata = safeGet(discovery, 'metadata', {});
                    const result = safeString(metadata.result, 'UNKNOWN');
                    const resultIcon = result === 'PASS' ? '✅' : '❌';
                    const resultColor = result === 'PASS' ? 'var(--success)' : 'var(--error)';
                    const columnName = safeString(metadata.column_name, 'N/A');
                    const expectedValue = safeString(metadata.expected_value, 'N/A');
                    const matchingRows = safeNumber(metadata.matching_rows, 0);
                    const totalRows = safeNumber(metadata.total_rows, 0);
                    const reason = safeString(metadata.reason);
                    const screenshot = safeString(metadata.screenshot);
                    
                    html += `
                        <div class="discovery-item verification ${result === 'PASS' ? '' : 'failed'}" style="border-left-color: ${resultColor};">
                            <div class="discovery-header">
                                <strong class="discovery-name" style="color: ${resultColor};">
                                    ${resultIcon} VERIFICATION: ${name}
                                </strong>
                                <span class="discovery-badge" style="background: ${resultColor};">Table Check</span>
                            </div>
                            <div class="discovery-details">
                                <div><strong>Column:</strong> ${columnName}</div>
                                <div><strong>Expected:</strong> All rows contain "${expectedValue}"</div>
                                <div><strong>Result:</strong> ${matchingRows}/${totalRows} rows matched</div>
                                ${reason ? `<div style="color: var(--error); font-weight: 600; margin-top: 8px;">${reason}</div>` : ''}
                            </div>
                            ${screenshot ? `
                                <img src="/api/screenshots/${screenshot.split('/').pop()}" 
                                     onerror="this.style.display='none'; this.nextElementSibling.style.display='block';"
                                     style="max-width: 400px; margin-top: 15px; border-radius: 6px; border: 2px solid ${resultColor}; cursor: pointer;"
                                     onclick="window.open('/api/screenshots/${screenshot.split('/').pop()}', '_blank')">

        function switchTab(tabName, event) {
            document.querySelectorAll('.tab-content').forEach(tab => {
                tab.classList.remove('active');
            });
            
            document.querySelectorAll('.tab-button').forEach(btn => {
                btn.classList.remove('active');
            });
            
            document.getElementById(`tab-${tabName}`).classList.add('active');
            
            // Find and activate the clicked button
            if (event && event.target) {
                event.target.classList.add('active');
            } else {
                // Fallback: find button by onclick attribute
                const buttons = document.querySelectorAll('.tab-button');
                buttons.forEach(btn => {
                    if (btn.getAttribute('onclick') && btn.getAttribute('onclick').includes(`'${tabName}'`)) {
                        btn.classList.add('active');
                    }
                });
            }
        }

        async function approveDiscoveries() {
            const btn = event.target;
            const originalText = btn.textContent;
            
            btn.disabled = true;
            btn.textContent = '⏳ Updating Registry...';
            
            try {
                const response = await fetch(`/api/executions/${executionId}/approve-discoveries`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' }
                });
                
                const result = await response.json();
                
                if (response.ok) {
                    showActionMessage(`✅ Registry Updated! ${result.discoveries_updated} discoveries saved. Future tests will be 70% faster!`, 'success');
                    btn.textContent = '✅ Registry Updated';
                    btn.style.background = 'var(--neutral)';
                } else {
                    throw new Error(result.error || 'Failed to update registry');
                }
            } catch (error) {
                showActionMessage(`❌ Error: ${error.message}`, 'error');
                btn.disabled = false;
                btn.textContent = originalText;
            }
        }
        
        async function generatePlaywrightTest() {
            // Find or create status div
            let statusDiv = document.getElementById('playwright-status');
            const resultsSection = document.getElementById('playwright-results-section');
            
            // If status div doesn't exist, create it or use results section
            if (!statusDiv) {
                if (resultsSection) {
                    // Create status div before results section
                    statusDiv = document.createElement('div');
                    statusDiv.id = 'playwright-status';
                    resultsSection.parentNode.insertBefore(statusDiv, resultsSection);
                } else {
                    // Create in playwright tab if it exists
                    const playwrightTab = document.querySelector('[onclick*="playwright"]');
                    if (playwrightTab) {
                        statusDiv = document.createElement('div');
                        statusDiv.id = 'playwright-status';
                        statusDiv.style.marginTop = '20px';
                        playwrightTab.parentElement.appendChild(statusDiv);
                    } else {
                        console.error('Cannot find playwright-status or playwright-results-section');
                        return;
                    }
                }
            }
            
            statusDiv.innerHTML = '<div style="text-align: center;"><span class="spinner"></span> Generating test code and validating...</div>';
            
            try {
                const response = await fetch(`/api/executions/${executionId}/generate-and-validate`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ validate: true })
                });
                
                const result = await response.json();
                
                if (response.ok) {
                    showActionMessage(`✅ Test Generated Successfully!`, 'success');
                    displayPlaywrightResults(result);
                    
                    // Reload main results to update Overview tab with Playwright data
                    await pollResults();
                } else {
                    throw new Error(result.error || 'Failed to generate test');

                statusDiv.innerHTML = `

                        <div class="alert-icon">❌</div>

                warning: { bg: '#FFF3E0', text: 'var(--warning)', border: 'var(--warning)' },
                info: { bg: '#E3F2FD', text: 'var(--info)', border: 'var(--info)' }
            };
            
            const color = colors[type] || colors.info;
            
            container.innerHTML = `
                <div style="background: ${color.bg}; color: ${color.text}; padding: 15px; border-radius: 8px; border-left: 4px solid ${color.border}; animation: fadeIn 0.3s;">
                    ${message}
                </div>
            `;
        }
        
        function retryTest() {
            if (confirm('Retry this test with the same story?')) {
                location.href = '/';
            }
        }
        
        function downloadRawData() {
            if (currentResults) {
                const dataStr = JSON.stringify(currentResults, null, 2);
                const dataUri = 'data:application/json;charset=utf-8,'+ encodeURIComponent(dataStr);
                const exportFileDefaultName = `execution_${executionId}.json`;
                
                const linkElement = document.createElement('a');
                linkElement.setAttribute('href', dataUri);
                linkElement.setAttribute('download', exportFileDefaultName);
                linkElement.click();
                
                showActionMessage('📥 Raw data downloaded successfully!', 'success');
            }
        }
        
        function downloadPlaywrightTest(execId) {
            console.log('🔵 downloadPlaywrightTest called with execId:', execId);
            showActionMessage('⏳ Starting download...', 'info');
            
            // First, get the filename from metadata API
            console.log('📡 Fetching metadata from /api/executions/' + execId + '/generated-test');
            fetch(`/api/executions/${execId}/generated-test`)
                .then(response => {
                    console.log('📥 Metadata response status:', response.status);
                    if (!response.ok) {
                        throw new Error('Failed to fetch metadata: ' + response.status);
                    }
                    return response.json();
                })
                .then(metadata => {
                    console.log('✅ Metadata received:', metadata);
                    // Extract filename from metadata
                    let filename = 'test.py'; // Default fallback
                    if (metadata.filename) {
                        // Extract just the filename from full path
                        const pathParts = metadata.filename.split('/');
                        filename = pathParts[pathParts.length - 1];
                        console.log('📝 Extracted filename:', filename);
                    } else if (metadata.test_name) {
                        filename = `${metadata.test_name}.py`;
                        console.log('📝 Using test_name:', filename);
                    }
                    
                    // Use direct URL approach instead of blob - Chrome respects download attribute better
                    const downloadUrl = `/api/executions/${execId}/download-test`;
                    console.log('🔗 Creating direct download link to:', downloadUrl);
                    
                    // Create a link to the actual endpoint (not blob URL)
                    // This way Chrome will use the Content-Disposition header from the server
                    const linkElement = document.createElement('a');
                    linkElement.style.display = 'none';
                    linkElement.href = downloadUrl;
                    linkElement.download = filename; // Set filename as fallback
                    linkElement.setAttribute('download', filename); // Also set as attribute
                    linkElement.setAttribute('target', '_blank'); // Open in new tab if download fails
                    document.body.appendChild(linkElement);
                    
                    console.log('🖱️ Clicking direct download link...');
                    console.log('📋 Link element:', {
                        href: linkElement.href,
                        download: linkElement.download,
                        hasAttribute: linkElement.hasAttribute('download')
                    });
                    
                    // Trigger download
                    linkElement.click();
                    console.log('✅ Download triggered');
                    
                    // Cleanup
                    setTimeout(() => {
                        document.body.removeChild(linkElement);
                        console.log('🧹 Cleaned up link element');
                    }, 1000);
                    
                    showActionMessage(`📥 Download started: ${filename}`, 'success');
                    console.log('✅ Download process completed');
                })
                .catch(error => {
                    console.error('❌ Download error:', error);
                    console.error('Error stack:', error.stack);
                    showActionMessage('❌ Download failed: ' + error.message, 'error');
                });
        }
        
        function viewRawData() {
            if (currentResults) {
                const dataStr = JSON.stringify(currentResults, null, 2);
                const newWindow = window.open('', '_blank');
                newWindow.document.write(`
                    <html>
                    <head><title>Raw Execution Data - ${executionId}</title></head>
                    <body style="font-family: monospace; padding: 20px; background: #1e1e1e; color: #d4d4d4;">
                    <h2 style="color: #4fc3f7;">Raw Execution Data</h2>
                    <pre style="white-space: pre-wrap; word-wrap: break-word;">${dataStr}</pre>
                    </body>
                    </html>
                `);
            }
        }
        
        // ===================================
        // REGISTRY VIEWER/EDITOR
        // ===================================
        
        async function viewRegistry() {
            try {
                // Fetch list of registries
                const response = await fetch('/api/registry');
                if (!response.ok) throw new Error('Failed to load registries');
                
                const data = await response.json();
                const registries = data.registries || [];
                
                if (registries.length === 0) {
                    showActionMessage('⚠️ No registries found', 'warning');
                    return;
                }
                
                // For now, load the first registry (or find clinicalcommons)
                let registry = registries.find(r => r.domain.includes('clinicalcommons')) || registries[0];
                
                // Load registry content
                const regResponse = await fetch(`/api/registry/${registry.domain}/${registry.page}`);
                if (!regResponse.ok) throw new Error('Failed to load registry content');
                
                const regData = await regResponse.json();
                
                // Display modal
                showRegistryModal(registry.domain, registry.page, regData);
                
            } catch (error) {
                console.error('Error loading registry:', error);
                showActionMessage('❌ Failed to load registry: ' + error.message, 'error');
            }
        }
        
        function showRegistryModal(domain, page, regData) {
            // Create modal HTML
            const modalHTML = `
                <div id="registry-modal" style="
                    position: fixed;
                    top: 0;
                    left: 0;
                    width: 100%;
                    height: 100%;
                    background: rgba(0,0,0,0.8);
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    z-index: 10000;
                    animation: fadeIn 0.3s;
                " onclick="if(event.target.id === 'registry-modal') closeRegistryModal()">
                    <div style="
                        background: var(--card-bg, #fff);
                        border-radius: 12px;
                        padding: 30px;
                        max-width: 900px;
                        width: 90%;
                        max-height: 80vh;
                        overflow-y: auto;
                        box-shadow: 0 20px 60px rgba(0,0,0,0.3);
                    " onclick="event.stopPropagation()">
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                            <h2 style="margin: 0;">📋 Element Registry</h2>
                            <button onclick="closeRegistryModal()" style="
                                background: none;
                                border: none;
                                font-size: 24px;
                                cursor: pointer;
                                padding: 5px 10px;
                            ">✕</button>
                        </div>
                        
                        <div style="background: var(--code-bg, #f5f5f5); padding: 15px; border-radius: 8px; margin-bottom: 20px;">
                            <p style="margin: 0;"><strong>Domain:</strong> ${domain}</p>
                            <p style="margin: 10px 0 0;"><strong>Page:</strong> ${page}</p>
                            <p style="margin: 10px 0 0; opacity: 0.7; font-size: 0.9em;">Total Elements: ${Object.keys(regData.elements || {}).length}</p>
                        </div>
                        
                        <div id="registry-elements">
                            ${renderRegistryElements(domain, page, regData.elements || {})}
                        </div>
                    </div>
                </div>
            `;
            
            document.body.insertAdjacentHTML('beforeend', modalHTML);
        }
        
        function renderRegistryElements(domain, page, elements) {
            const elementKeys = Object.keys(elements);
            
            if (elementKeys.length === 0) {
                return '<p style="text-align: center; opacity: 0.7;">No elements in registry</p>';
            }
            
            return elementKeys.map(key => {
                const element = elements[key];
                const selector = element.selector || 'N/A';
                const usageCount = element.usage_count || 0;
                const lastUsed = element.last_used ? new Date(element.last_used).toLocaleString() : 'Never';
                
                return `
                    <div class="registry-element-card" style="
                        border: 1px solid var(--border-color, #ddd);
                        border-radius: 8px;
                        padding: 15px;
                        margin-bottom: 15px;
                        background: var(--bg-color, #fff);
                    ">
                        <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px;">
                            <div style="flex: 1;">
                                <h4 style="margin: 0 0 10px; color: var(--primary-color, #2196F3); font-size: 1.1em;">${key}</h4>
                                <div style="display: flex; gap: 15px; font-size: 0.9em; opacity: 0.7;">
                                    <span>📊 Used: ${usageCount}x</span>
                                    <span>🕒 ${lastUsed}</span>
                                </div>
                            </div>
                            <div style="display: flex; gap: 10px;">
                                <button onclick="editRegistryElement('${domain}', '${page}', '${key.replace(/'/g, "\\'")}', '${selector.replace(/'/g, "\\'")}')" class="btn-secondary" style="padding: 8px 15px; font-size: 0.9em;">
                                    ✏️ Edit
                                </button>
                                <button onclick="deleteRegistryElement('${domain}', '${page}', '${key.replace(/'/g, "\\'")}');" class="btn-secondary" style="padding: 8px 15px; font-size: 0.9em; background: var(--error-color, #f44336); color: white;">
                                    🗑️ Delete
                                </button>
                            </div>
                        </div>
                        
                        <div style="background: var(--code-bg, #f5f5f5); padding: 12px; border-radius: 6px; font-family: monospace; font-size: 0.9em; overflow-x: auto;">
                            <strong>Selector:</strong><br>
                            <code>${selector}</code>
                        </div>
                    </div>
                `;
            }).join('');
        }
        
        function closeRegistryModal() {
            const modal = document.getElementById('registry-modal');
            if (modal) modal.remove();
        }
        
        async function editRegistryElement(domain, page, elementKey, currentSelector) {
            const newSelector = prompt(`Edit selector for "${elementKey}":`, currentSelector);
            
            if (newSelector && newSelector !== currentSelector) {
                try {
                    const response = await fetch(`/api/registry/${domain}/${page}/element`, {
                        method: 'PUT',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({
                            element_key: elementKey,
                            selector: newSelector
                        })
                    });
                    
                    if (!response.ok) throw new Error('Failed to update element');
                    
                    showActionMessage('✅ Element updated successfully!', 'success');
                    
                    // Reload registry modal
                    closeRegistryModal();
                    setTimeout(() => viewRegistry(), 500);
                    
                } catch (error) {
                    console.error('Error updating element:', error);
                    showActionMessage('❌ Failed to update element: ' + error.message, 'error');
                }
            }
        }
        
        async function deleteRegistryElement(domain, page, elementKey) {
            if (!confirm(`Are you sure you want to delete "${elementKey}" from the registry?`)) {
                return;
            }
            
            try {
                const response = await fetch(`/api/registry/${domain}/${page}/element`, {
                    method: 'DELETE',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        element_key: elementKey
                    })
                });
                
                if (!response.ok) throw new Error('Failed to delete element');
                
                showActionMessage('✅ Element deleted successfully!', 'success');
                
                // Reload registry modal
                closeRegistryModal();
                setTimeout(() => viewRegistry(), 500);
                
            } catch (error) {
                console.error('Error deleting element:', error);
                showActionMessage('❌ Failed to delete element: ' + error.message, 'error');
            }
        }
        
        // Start polling
        pollResults();
        pollInterval = setInterval(pollResults, 2000);
    </script>
</body>
</html>
