<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Execution Results - AI Agent QA</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        .live-indicator {
            display: inline-block;
            width: 10px;
            height: 10px;
            background: #4CAF50;
            border-radius: 50%;
            animation: pulse 1.5s infinite;
            margin-right: 8px;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
        .screenshots-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .screenshot-item {
            border: 2px solid #ddd;
            border-radius: 8px;
            padding: 10px;
            background: #f9f9f9;
        }
        .screenshot-item img {
            width: 100%;
            border-radius: 4px;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .screenshot-item img:hover {
            transform: scale(1.02);
        }
        .action-item {
            background: #f5f5f5;
            border-left: 4px solid #2196F3;
            padding: 15px;
            margin: 10px 0;
            border-radius: 4px;
        }
        .action-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
        }
        .iteration {
            background: #2196F3;
            color: white;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
        }
        .status-running { background: #FF9800; color: white; padding: 8px 16px; border-radius: 4px; }
        .status-completed { background: #4CAF50; color: white; padding: 8px 16px; border-radius: 4px; }
        .status-error { background: #f44336; color: white; padding: 8px 16px; border-radius: 4px; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🤖 AI Agent QA - Results</h1>
            <p class="subtitle"><a href="/">← Back to Home</a></p>
        </header>

        <main>
            <div class="card">
                <h2>
                    <span id="live-indicator" class="live-indicator" style="display: none;"></span>
                    Execution: <span id="execution-id">{{ execution_id }}</span>
                </h2>
                
                <div id="results-content">
                    <p class="loading">Loading results...</p>
                </div>
            </div>
        </main>

        <footer>
            <p>Architecture 2: LLM-driven autonomous execution</p>
        </footer>
    </div>

    <script>
        const executionId = "{{ execution_id }}";
        let pollInterval;
        let lastActionCount = 0;
        let lastScreenshotCount = 0;
        
        async function pollResults() {
            try {
                // Try to get full results first
                let response = await fetch(`/api/executions/${executionId}/results`);
                let results;
                
                if (response.ok) {
                    results = await response.json();
                } else {
                    // Fallback to status endpoint if results not available
                    response = await fetch(`/api/executions/${executionId}/status`);
                    const status = await response.json();
                    results = {
                        execution_id: executionId,
                        status: status.status,
                        story: status.story,
                        actions_taken: [],
                        screenshots: []
                    };
                }
                
                displayResults(results);
                
                // If still running, continue polling
                if (results.status === 'running') {
                    document.getElementById('live-indicator').style.display = 'inline-block';
                } else {
                    document.getElementById('live-indicator').style.display = 'none';
                    clearInterval(pollInterval);
                }
            } catch (error) {
                console.error('Error loading results:', error);
            }
        }
        
        function displayResults(results) {
            const container = document.getElementById('results-content');
            
            let html = `
                <div class="results-header">
                    <div class="status-badge status-${results.status}">${results.status}</div>
                    <p><strong>Story:</strong> ${results.story}</p>
                    ${results.duration ? `<p><strong>Duration:</strong> ${results.duration.toFixed(2)}s</p>` : ''}
                </div>
            `;
            
            if (results.summary) {
                html += `
                    <div class="summary">
                        <h3>✅ Summary</h3>
                        <p>${results.summary}</p>
                    </div>
                `;
            }
            
            if (results.error) {
                html += `
                    <div class="error-box">
                        <h3>❌ Error</h3>
                        <pre>${results.error}</pre>
                    </div>
                `;
            }
            
            if (results.actions_taken && results.actions_taken.length > 0) {
                html += `
                    <div class="actions">
                        <h3>🎬 Actions Taken (${results.actions_taken.length})</h3>
                        <div class="actions-list">
                `;
                
                results.actions_taken.forEach((action, index) => {
                    const isNew = index >= lastActionCount;
                    html += `
                        <div class="action-item" ${isNew ? 'style="animation: fadeIn 0.5s;"' : ''}>
                            <div class="action-header">
                                <strong>${index + 1}. ${action.tool}</strong>
                                <span class="iteration">Iteration ${action.iteration}</span>
                            </div>
                            <div class="action-input">
                                <code>${JSON.stringify(action.input)}</code>
                            </div>
                            <div class="action-result" style="margin-top: 8px; color: #666;">
                                ${action.result.substring(0, 200)}${action.result.length > 200 ? '...' : ''}
                            </div>
                        </div>
                    `;
                });
                
                lastActionCount = results.actions_taken.length;
                
                html += `
                        </div>
                    </div>
                `;
            }
            
            if (results.screenshots && results.screenshots.length > 0) {
                html += `
                    <div class="screenshots">
                        <h3>📸 Screenshots (${results.screenshots.length})</h3>
                        <div class="screenshots-grid">
                `;
                
                results.screenshots.forEach((screenshot, index) => {
                    // Extract filename from screenshot string like "Screenshot saved: 001_file.png (123 bytes)"
                    const match = screenshot.match(/([0-9]+_[\w-]+\.png)/);
                    const filename = match ? match[1] : `screenshot_${index + 1}.png`;
                    
                    const isNew = index >= lastScreenshotCount;
                    html += `
                        <div class="screenshot-item" ${isNew ? 'style="animation: fadeIn 0.5s;"' : ''}>
                            <img src="/api/screenshots/${filename}" alt="Screenshot ${index + 1}" 
                                 onclick="window.open('/api/screenshots/${filename}', '_blank')">
                            <p style="text-align: center; margin-top: 8px; font-size: 12px;">${filename}</p>
                        </div>
                    `;
                });
                
                lastScreenshotCount = results.screenshots.length;
                
                html += `
                        </div>
                    </div>
                `;
            }
            
            // Discoveries section
            if (results.discoveries && results.discoveries.length > 0 && results.status === 'completed') {
                html += `
                    <div class="discoveries" style="margin-top: 30px; border: 2px solid #4CAF50; border-radius: 8px; padding: 20px; background: #f0f9f0;">
                        <h3>📝 Discoveries (${results.discoveries.length})</h3>
                        <p style="color: #666; margin-bottom: 15px;">
                            The AI agent discovered these elements using tree climbing and disambiguation. 
                            Approve to save them to the registry for faster future runs.
                        </p>
                        <ul style="list-style: none; padding: 0;">
                `;
                
                results.discoveries.forEach((discovery, index) => {
                    const method = discovery.discovery_method || 'unknown';
                    const depth = discovery.metadata?.tree_depth || 1;
                    
                    // Check if this is a verification discovery
                    if (method === 'table_verification') {
                        const metadata = discovery.metadata || {};
                        const result = metadata.result || 'UNKNOWN';
                        const resultIcon = result === 'PASS' ? '✅' : '❌';
                        const resultColor = result === 'PASS' ? '#4CAF50' : '#f44336';
                        const totalRows = metadata.total_rows || 0;
                        const matchingRows = metadata.matching_rows || 0;
                        const columnName = metadata.column_name || 'unknown';
                        const expectedValue = metadata.expected_value || '';
                        const screenshot = metadata.screenshot || '';
                        
                        html += `
                            <li style="background: white; border: 2px solid ${resultColor}; border-radius: 4px; padding: 15px; margin: 8px 0;">
                                <div style="display: flex; justify-content: space-between; align-items: start;">
                                    <div style="flex: 1;">
                                        <strong style="color: ${resultColor};">${resultIcon} VERIFICATION: ${discovery.name}</strong>
                                        <div style="color: #666; font-size: 13px; margin-top: 8px;">
                                            <strong>Column:</strong> ${columnName}<br>
                                            <strong>Expected:</strong> All rows contain "${expectedValue}"<br>
                                            <strong>Result:</strong> ${matchingRows}/${totalRows} rows matched
                                        </div>
                                        ${metadata.mismatches ? `
                                        <div style="margin-top: 8px; padding: 8px; background: #fff3cd; border-radius: 4px; font-size: 12px;">
                                            <strong>Mismatches:</strong> ${metadata.mismatches.join(', ')}
                                        </div>
                                        ` : ''}
                                        ${screenshot ? `
                                        <div style="margin-top: 10px;">
                                            <img src="/api/screenshots/${screenshot.split('/').pop()}" 
                                                 style="max-width: 300px; border: 1px solid #ddd; border-radius: 4px; cursor: pointer;"
                                                 onclick="window.open('/api/screenshots/${screenshot.split('/').pop()}', '_blank')"
                                                 alt="Verification screenshot">
                                        </div>
                                        ` : ''}
                                    </div>
                                </div>
                            </li>
                        `;
                    } else {
                        // Regular discovery (click, etc.)
                        const methodLabel = method === 'tree_climbing' ? `🌳 Tree Climbing (depth ${depth})` : '🤖 AI Disambiguation';
                        
                        html += `
                            <li style="background: white; border: 1px solid #ddd; border-radius: 4px; padding: 12px; margin: 8px 0;">
                                <div style="display: flex; justify-content: space-between; align-items: start;">
                                    <div style="flex: 1;">
                                        <strong>${discovery.name}</strong>
                                        <div style="color: #666; font-size: 12px; margin-top: 4px;">
                                            ${methodLabel}
                                        </div>
                                        <div style="margin-top: 8px; font-family: monospace; font-size: 11px;">
                                            <div>📥 Query: <code style="background: #f5f5f5; padding: 2px 6px; border-radius: 3px;">${discovery.original_query}</code></div>
                                            <div style="margin-top: 4px;">📤 Optimized: <code style="background: #f5f5f5; padding: 2px 6px; border-radius: 3px;">${discovery.final_selector.substring(0, 80)}${discovery.final_selector.length > 80 ? '...' : ''}</code></div>
                                        </div>
                                    </div>
                                </div>
                            </li>
                        `;
                    }
                });
                
                html += `
                        </ul>
                        <div style="margin-top: 20px; text-align: center;">
                            <button id="approve-btn" onclick="approveDiscoveries()" 
                                    style="background: #4CAF50; color: white; border: none; padding: 12px 30px; font-size: 16px; border-radius: 4px; cursor: pointer; font-weight: bold; margin-right: 10px;">
                                ✅ Approve & Update Registry
                            </button>
                            <button id="generate-test-btn" onclick="generatePlaywrightTest()" 
                                    style="background: #2196F3; color: white; border: none; padding: 12px 30px; font-size: 16px; border-radius: 4px; cursor: pointer; font-weight: bold;">
                                🎭 Generate Playwright Test
                            </button>
                            <p id="approve-msg" style="margin-top: 10px; color: #4CAF50; display: none;"></p>
                            <p id="generate-msg" style="margin-top: 10px; display: none;"></p>
                        </div>
                    </div>
                `;
            }
            
            container.innerHTML = html;
        }
        
        // Approve discoveries and update registry
        async function approveDiscoveries() {
            const btn = document.getElementById('approve-btn');
            const msg = document.getElementById('approve-msg');
            
            // Disable button
            btn.disabled = true;
            btn.style.opacity = '0.6';
            btn.style.cursor = 'not-allowed';
            btn.textContent = '⏳ Updating Registry...';
            
            try {
                const response = await fetch(`/api/executions/${executionId}/approve-discoveries`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });
                
                const result = await response.json();
                
                if (response.ok) {
                    msg.textContent = `✅ Success! Registry updated with ${result.discoveries_updated} discoveries. Next test run will be 70% faster!`;
                    msg.style.color = '#4CAF50';
                    msg.style.display = 'block';
                    btn.textContent = '✅ Registry Updated';
                    btn.style.background = '#888';
                } else {
                    throw new Error(result.error || 'Failed to update registry');
                }
            } catch (error) {
                console.error('Error approving discoveries:', error);
                msg.textContent = `❌ Error: ${error.message}`;
                msg.style.color = '#f44336';
                msg.style.display = 'block';
                
                // Re-enable button on error
                btn.disabled = false;
                btn.style.opacity = '1';
                btn.style.cursor = 'pointer';
                btn.textContent = '✅ Approve & Update Registry';
            }
        }
        
        function displayPlaywrightResults(validation, comparison, screenshots) {
            // Check if section already exists
            let playwrightSection = document.getElementById('playwright-section');
            if (!playwrightSection) {
                // Create new section after the generate-msg
                const container = document.querySelector('.results-container');
                playwrightSection = document.createElement('div');
                playwrightSection.id = 'playwright-section';
                playwrightSection.style.cssText = 'margin-top: 30px; border: 2px solid #2196F3; border-radius: 8px; padding: 20px; background: #f0f8ff;';
                
                // Find where to insert (after generate-msg)
                const generateMsg = document.getElementById('generate-msg');
                if (generateMsg && generateMsg.parentNode) {
                    generateMsg.parentNode.insertBefore(playwrightSection, generateMsg.nextSibling);
                } else {
                    container.appendChild(playwrightSection);
                }
            }
            
            // Build content
            let html = `
                <h3 style="color: #2196F3; margin-top: 0;">🎭 Playwright Test Validation Results</h3>
                
                <div style="background: white; border-radius: 6px; padding: 15px; margin-bottom: 20px;">
                    <h4 style="margin-top: 0; color: #333;">📊 Test Execution Summary</h4>
                    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-top: 15px;">
                        <div style="background: ${validation.status === 'passed' ? '#e8f5e9' : '#ffebee'}; padding: 12px; border-radius: 4px;">
                            <div style="font-size: 12px; color: #666; margin-bottom: 4px;">Status</div>
                            <div style="font-size: 18px; font-weight: bold; color: ${validation.status === 'passed' ? '#4CAF50' : '#f44336'};">
                                ${validation.status === 'passed' ? '✅ PASSED' : '❌ FAILED'}
                            </div>
                        </div>
                        <div style="background: #f5f5f5; padding: 12px; border-radius: 4px;">
                            <div style="font-size: 12px; color: #666; margin-bottom: 4px;">Duration</div>
                            <div style="font-size: 18px; font-weight: bold; color: #333;">⏱️ ${validation.duration}s</div>
                        </div>
                        <div style="background: #e8f5e9; padding: 12px; border-radius: 4px;">
                            <div style="font-size: 12px; color: #666; margin-bottom: 4px;">Assertions Passed</div>
                            <div style="font-size: 18px; font-weight: bold; color: #4CAF50;">✅ ${validation.assertions_passed}</div>
                        </div>
                        ${validation.assertions_failed > 0 ? `
                        <div style="background: #ffebee; padding: 12px; border-radius: 4px;">
                            <div style="font-size: 12px; color: #666; margin-bottom: 4px;">Assertions Failed</div>
                            <div style="font-size: 18px; font-weight: bold; color: #f44336;">❌ ${validation.assertions_failed}</div>
                        </div>
                        ` : ''}
                    </div>
                </div>
                
                <div style="background: ${comparison.match ? '#e8f5e9' : '#fff3e0'}; border-radius: 6px; padding: 15px; margin-bottom: 20px;">
                    <h4 style="margin-top: 0; color: #333;">🎯 Recommendation</h4>
                    <div style="font-size: 16px; font-weight: bold; color: ${comparison.match ? '#4CAF50' : '#FF9800'};">
                        ${comparison.recommendation}
                    </div>
                    ${comparison.differences && comparison.differences.length > 0 ? `
                    <div style="margin-top: 10px;">
                        <strong>Differences:</strong>
                        <ul style="margin: 8px 0; padding-left: 20px;">
                            ${comparison.differences.map(diff => `<li style="color: #666;">${diff}</li>`).join('')}
                        </ul>
                    </div>
                    ` : ''}
                </div>
            `;
            
            // Add screenshots section
            if (screenshots && screenshots.length > 0) {
                html += `
                    <div style="background: white; border-radius: 6px; padding: 15px;">
                        <h4 style="margin-top: 0; color: #333;">📸 Playwright Screenshots (${screenshots.length})</h4>
                        <div class="screenshots-grid">
                `;
                
                screenshots.forEach((screenshot, index) => {
                    html += `
                        <div class="screenshot-item" style="animation: fadeIn 0.5s;">
                            <img src="/api/screenshots/${screenshot.filename}" alt="Playwright Screenshot ${index + 1}" 
                                 onclick="window.open('/api/screenshots/${screenshot.filename}', '_blank')"
                                 style="width: 100%; border-radius: 4px; cursor: pointer; border: 2px solid #2196F3;">
                            <p style="text-align: center; margin-top: 8px; font-size: 12px; color: #2196F3; font-weight: bold;">${screenshot.filename}</p>
                        </div>
                    `;
                });
                
                html += `
                        </div>
                    </div>
                `;
            }
            
            // Show execution output
            if (validation.stdout) {
                html += `
                    <div style="background: white; border-radius: 6px; padding: 15px; margin-top: 20px;">
                        <h4 style="margin-top: 0; color: #333;">📝 Execution Output</h4>
                        <pre style="background: #f5f5f5; padding: 12px; border-radius: 4px; overflow-x: auto; font-size: 12px; line-height: 1.5; max-height: 300px; overflow-y: auto;">${validation.stdout}</pre>
                    </div>
                `;
            }
            
            playwrightSection.innerHTML = html;
            playwrightSection.style.display = 'block';
            
            // Scroll to the new section
            setTimeout(() => {
                playwrightSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }, 300);
        }
        
        async function generatePlaywrightTest() {
            const btn = document.getElementById('generate-test-btn');
            const msg = document.getElementById('generate-msg');
            
            // Disable button
            btn.disabled = true;
            btn.style.opacity = '0.6';
            btn.style.cursor = 'not-allowed';
            btn.textContent = '⏳ Generating Test...';
            
            try {
                const response = await fetch(`/api/executions/${executionId}/generate-and-validate`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        validate: true
                    })
                });
                
                const result = await response.json();
                
                if (response.ok) {
                    const validation = result.validation;
                    const comparison = result.comparison;
                    const playwrightScreenshots = result.playwright_screenshots || [];
                    
                    let message = `✅ Test Generated: ${result.test_file}<br>`;
                    message += `📊 Validation: ${validation.status} (${validation.duration}s)<br>`;
                    message += `✅ Assertions: ${validation.assertions_passed} passed`;
                    
                    if (validation.assertions_failed > 0) {
                        message += `, ${validation.assertions_failed} failed`;
                    }
                    
                    message += `<br>🎯 ${comparison.recommendation}`;
                    
                    msg.innerHTML = message;
                    msg.style.color = comparison.match ? '#4CAF50' : '#FF9800';
                    msg.style.display = 'block';
                    msg.style.padding = '15px';
                    msg.style.background = comparison.match ? '#e8f5e9' : '#fff3e0';
                    msg.style.borderRadius = '4px';
                    msg.style.textAlign = 'left';
                    
                    btn.textContent = '✅ Test Generated';
                    btn.style.background = '#888';
                    
                    // Add view code button
                    if (result.test_path) {
                        setTimeout(() => {
                            msg.innerHTML += `<br><br><a href="/api/executions/${executionId}/generated-test" target="_blank" style="color: #2196F3; text-decoration: underline;">📄 View Generated Code</a>`;
                        }, 1000);
                    }
                    
                    // Display Playwright validation section
                    displayPlaywrightResults(validation, comparison, playwrightScreenshots);
                } else {
                    throw new Error(result.error || 'Failed to generate test');
                }
            } catch (error) {
                console.error('Error generating test:', error);
                msg.innerHTML = `❌ Error: ${error.message}`;
                msg.style.color = '#f44336';
                msg.style.display = 'block';
                
                // Re-enable button on error
                btn.disabled = false;
                btn.style.opacity = '1';
                btn.style.cursor = 'pointer';
                btn.textContent = '🎭 Generate Playwright Test';
            }
        }
        
        // Start polling
        pollResults();
        pollInterval = setInterval(pollResults, 2000); // Poll every 2 seconds
    </script>
    
    <style>
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</body>
</html>
